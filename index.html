<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpenseFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: 'Inter Tight', sans-serif;
        background-color: #f7f3ea;
      }
      .font-display {
        font-family: 'Instrument Serif', serif;
      }
      .font-mono-ui {
        font-family: 'JetBrains Mono', monospace;
      }
      .bg-noise {
        background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .glass-card {
        background: rgba(255, 251, 245, 0.82);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(26, 26, 26, 0.08);
      }
      .soft-shadow {
        box-shadow: 0 20px 60px rgba(26, 26, 26, 0.08);
      }
      .fade-up {
        animation: fadeUp 0.6s ease both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
